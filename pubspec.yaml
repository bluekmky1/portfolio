name: portfolio
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.6.0

dependencies:
  cupertino_icons: ^1.0.8
  equatable: ^2.0.7
  flame: ^1.30.1
  flame_lottie: ^0.4.2+14
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_svg: ^2.2.0
  flutter_web_plugins:
    sdk: flutter
  go_router: ^16.0.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  lottie: ^3.3.1
  retrofit: ^4.5.0
  smooth_page_indicator: ^1.2.1
  url_launcher: ^6.3.2
  url_launcher_web: ^2.4.1

dev_dependencies:
  build_runner: ^2.4.13
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.8.0
  retrofit_generator: ^9.1.2

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - assets/lotties/
    - assets/lotties/congratulation/
    - assets/lotties/move/
    - assets/lotties/stop/

  fonts:
  - family: Pretendard
    fonts:
      - asset: fonts/Pretendard-Thin.ttf
        weight: 100
      - asset: fonts/Pretendard-ExtraLight.ttf
        weight: 200
      - asset: fonts/Pretendard-Light.ttf
        weight: 300
      - asset: fonts/Pretendard-Regular.ttf
        weight: 400
      - asset: fonts/Pretendard-Medium.ttf
        weight: 500
      - asset: fonts/Pretendard-SemiBold.ttf
        weight: 600
      - asset: fonts/Pretendard-Bold.ttf
        weight: 700
      - asset: fonts/Pretendard-ExtraBold.ttf
        weight: 800
      - asset: fonts/Pretendard-Black.ttf
        weight: 900
  - family: CarterOne
    fonts:
      - asset: fonts/CarterOne-Regular.ttf
        weight: 400
  - family: Tenada
    fonts:
      - asset: fonts/Tenada.ttf
        weight: 400